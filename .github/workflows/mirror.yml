name: mirror
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      sets:
        description: comma-separated set codes (empty = all)
        required: false
        default: ""
      dry_run:
        description: plan only
        required: false
        default: "false"
      refetch_sealed:
        description: re-store every sealed image, for a sealed object path change
        required: false
        default: "false"
      rebuild_bundles:
        description: rebuild every set bundle, ignoring the manifest
        required: false
        default: "false"
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: build imgdl
        run: go build -o imgdl ./cmd/imgdl
      - name: run mirror
        env:
          B2_BUCKET: ${{ vars.B2_BUCKET || 'b2://mtgban-images/magic' }}
          B2_ACCESS_KEY: ${{ secrets.B2_ACCESS_KEY }}
          B2_ACCESS_SECRET: ${{ secrets.B2_ACCESS_SECRET }}
          SETS: ${{ inputs.sets }}
          DRY_RUN: ${{ inputs.dry_run }}
          REFETCH_SEALED: ${{ inputs.refetch_sealed }}
          REBUILD_BUNDLES: ${{ inputs.rebuild_bundles }}
        run: |
          FLAGS=()
          if [ -n "$SETS" ]; then FLAGS+=(-sets "$SETS"); fi
          if [ "$DRY_RUN" = "true" ]; then FLAGS+=(-dry-run); fi
          if [ "$REFETCH_SEALED" = "true" ]; then FLAGS+=(-refetch-sealed); fi
          if [ "$REBUILD_BUNDLES" = "true" ]; then FLAGS+=(-rebuild-bundles); fi
          ./imgdl "${FLAGS[@]}"
