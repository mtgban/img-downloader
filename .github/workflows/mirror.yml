name: mirror
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      sets:
        description: comma-separated set codes (empty = all)
        required: false
        default: ""
      dry_run:
        description: plan only
        required: false
        default: "false"
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: run mirror
        env:
          B2_ACCESS_KEY: ${{ secrets.B2_ACCESS_KEY }}
          B2_ACCESS_SECRET: ${{ secrets.B2_ACCESS_SECRET }}
        run: |
          FLAGS=""
          if [ -n "${{ inputs.sets }}" ]; then FLAGS="$FLAGS -sets ${{ inputs.sets }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS -dry-run"; fi
          go run ./cmd/imgdl -bucket "b2://mtgban-images/magic" $FLAGS
