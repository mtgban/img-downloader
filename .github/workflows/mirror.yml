name: mirror
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      game:
        description: card game to mirror
        required: false
        default: magic
        type: choice
        options:
          - magic
          - lorcana
          - riftbound
      sets:
        description: comma-separated set codes (empty = all)
        required: false
        default: ""
      dry_run:
        description: plan only
        required: false
        default: "false"
      retry_missing:
        description: ask again for images the source previously had none of
        required: false
        default: "false"
      rebuild_bundles:
        description: rebuild every set bundle, ignoring the manifest
        required: false
        default: "false"
      datastore:
        description: datastore url for a non-Magic game (empty = the usual one for that game)
        required: false
        default: ""
concurrency:
  # one run per game: two games write different prefixes and do not conflict,
  # while two runs of the same game would fight over its state document
  group: mirror-${{ inputs.game || 'magic' }}
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: build imgdl
        run: go build -o imgdl ./cmd/imgdl
      - name: run mirror
        env:
          # each game keeps its objects, state and manifest under its own
          # prefix; the tool refuses to write a prefix another game claimed
          GAME: ${{ inputs.game || 'magic' }}
          # an existing B2_BUCKET variable still wins outright, so the Magic
          # run keeps whatever base it has today; the root is only how a game
          # that has no explicit variable gets its own prefix
          B2_BUCKET_EXPLICIT: ${{ vars.B2_BUCKET }}
          B2_BUCKET_ROOT: ${{ vars.B2_BUCKET_ROOT || 'b2://mtgban-images' }}
          B2_ACCESS_KEY: ${{ secrets.B2_ACCESS_KEY }}
          B2_ACCESS_SECRET: ${{ secrets.B2_ACCESS_SECRET }}
          # Magic builds its want-list from public bulk data; every other game
          # reads mtgban's own datastore, which is a different bucket with a
          # key of its own: a B2 application key is scoped to one bucket, and
          # the mirror only reads the datastore while it writes images.
          B2_DATASTORE_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}
          B2_DATASTORE_ACCESS_SECRET: ${{ secrets.B2_APPLICATION_KEY_DATASTORE }}
          IMGDL_DATASTORE_EXPLICIT: ${{ inputs.datastore }}
          IMGDL_DATASTORE_ROOT: ${{ vars.IMGDL_DATASTORE_ROOT || 'b2://mtgban-datastore' }}
          SETS: ${{ inputs.sets }}
          DRY_RUN: ${{ inputs.dry_run }}
          RETRY_MISSING: ${{ inputs.retry_missing }}
          REBUILD_BUNDLES: ${{ inputs.rebuild_bundles }}
        run: |
          # B2_BUCKET stays the full base the tool writes to, unchanged in
          # meaning; only how it is defaulted varies by game
          if [ -n "$B2_BUCKET_EXPLICIT" ]; then
            export B2_BUCKET="$B2_BUCKET_EXPLICIT"
          else
            export B2_BUCKET="${B2_BUCKET_ROOT}/${GAME}"
          fi
          if [ "$GAME" != "magic" ]; then
            if [ -n "$IMGDL_DATASTORE_EXPLICIT" ]; then
              export IMGDL_DATASTORE="$IMGDL_DATASTORE_EXPLICIT"
            else
              export IMGDL_DATASTORE="${IMGDL_DATASTORE_ROOT}/${GAME}/allCards.json"
            fi
          fi
          FLAGS=(-game "$GAME")
          if [ -n "$SETS" ]; then FLAGS+=(-sets "$SETS"); fi
          if [ "$DRY_RUN" = "true" ]; then FLAGS+=(-dry-run); fi
          if [ "$RETRY_MISSING" = "true" ]; then FLAGS+=(-retry-missing); fi
          if [ "$REBUILD_BUNDLES" = "true" ]; then FLAGS+=(-rebuild-bundles); fi
          ./imgdl "${FLAGS[@]}"
